# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Kotlin code style for this project:
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Set the maximum number of workers
org.gradle.workers.max=4

# CHANGED: Out-of-process execution lets KSP run safely in CI without UI/AWT crashes
kotlin.compiler.execution.strategy=out-of-process

# Allow the google-services plugin to work even if google-services.json is missing
googleServices.missing.passthrough=true